name: build_sukisu_ultra_for_polaris

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    env:
      useAnykernel: true
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libncurses5 libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev make unzip python-is-python3

      - name: Download kernel source
        run: |
          cd /home/runner
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sdm845.git -b lineage-22.2 kernel_sdm845 --depth=1

      - name: Download gcc and clang
        run: |
          cd /home/runner
          git clone https://github.com/PixelExperience/prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc_aarch64
          git clone https://github.com/PixelExperience/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc_arm
          git clone https://github.com/PixelExperience/prebuilts_clang_kernel_linux-x86_clang-r416183b.git --depth=1 clang-r416183b

      - name: Integrate SukiSU Ultra
        run: |
          cd /home/runner/kernel_sdm845
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Debug SUSFS guard
        run: |
          cd /home/runner/kernel_sdm845
          echo "=== kernel_includes.h line 70-90 ==="
          sed -n '70,90p' drivers/kernelsu/kernel_includes.h || true
          echo "=== KSU Kconfig SUSFS entries ==="
          grep -n "KSU_SUSFS" drivers/kernelsu/Kconfig || true

      - name: Apply exec.c patch fix (manual hook)
        run: |
          cd /home/runner/kernel_sdm845
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU_patch.git /tmp/SukiSU_patch
          patch -p1 --fuzz=3 < /tmp/SukiSU_patch/hooks/syscall_hooks.patch || true
          if find . -name "*.rej" | grep -q .; then
            echo "Patch conflicts detected, relying on existing KSU hooks."
          fi
          find . -name "*.rej" -delete

      - name: Backport set_memory.h for 4.9
        run: |
          cd /home/runner/kernel_sdm845
          if [ -f "arch/arm64/include/asm/set_memory.h" ]; then
            echo "set_memory.h already exists. Skipping backport."
          else
            curl -LSs "https://raw.githubusercontent.com/torvalds/linux/v4.19/arch/arm64/include/asm/set_memory.h" -o arch/arm64/include/asm/set_memory.h
            echo "set_memory.h backported."
          fi

      - name: Configure kernel
        run: |
          cd /home/runner/kernel_sdm845
          PATH="/home/runner/clang-r416183b/bin:${PATH}"
          cat ./arch/arm64/configs/vendor/xiaomi/mi845_defconfig > ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig
          cat ./arch/arm64/configs/vendor/xiaomi/polaris.config >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig

          # --- SukiSU Ultra 核心配置 ---
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig
          echo "CONFIG_KSU_DEBUG=n" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig
          echo "CONFIG_KALLSYMS=y" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig

          # --- 4.9 内核禁用 SUSFS ---
          echo "# CONFIG_KSU_SUSFS is not set" >> ./arch/arm64/configs/vendor/xiaomi/polaris_defconfig

          make O=out ARCH=arm64 vendor/xiaomi/polaris_defconfig

          # 强制清除 SUSFS 及子选项，防止 setup.sh 或 Kconfig default y 重新打开
          ./scripts/config --file out/.config -d KSU_SUSFS
          ./scripts/config --file out/.config -d KSU_SUSFS_SUS_PATH
          ./scripts/config --file out/.config -d KSU_SUSFS_SUS_MOUNT
          ./scripts/config --file out/.config -d KSU_SUSFS_SUS_KSTAT
          ./scripts/config --file out/.config -d KSU_SUSFS_SPOOF_UNAME
          ./scripts/config --file out/.config -d KSU_SUSFS_OPEN_REDIRECT
          ./scripts/config --file out/.config -d KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          ./scripts/config --file out/.config -d KSU_SUSFS_SUS_OVERLAYFS

          make O=out ARCH=arm64 olddefconfig

          echo "=== Final KSU config ==="
          grep -E "CONFIG_KSU" out/.config || echo "No KSU config found!"

      - name: Build
        run: |
          cd /home/runner/kernel_sdm845
          PATH="/home/runner/clang-r416183b/bin:${PATH}"
          make -j$(nproc --all) O=out CC=clang ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=/home/runner/gcc_aarch64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=/home/runner/gcc_arm/bin/arm-linux-androideabi- AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LLVM_IAS=1 LLVM=1

      - name: Print date
        run: |
          echo "START_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Pack AnyKernel3.zip
        run: |
          cd /home/runner/kernel_sdm845
          git clone --recursive --depth=1 -j $(nproc) --branch polaris https://github.com/Shuery-Shuai/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd /home/runner/kernel_sdm845/AnyKernel3
          zip -r ../AnyKernel3.zip *

          echo "SukiSU Ultra integrated (SUSFS disabled for 4.9)" >> $GITHUB_STEP_SUMMARY
          echo "Flash zip using recovery" >> $GITHUB_STEP_SUMMARY

      - name: "Upload AnyKernel3 image"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: "AnyKernel3"
          path: "/home/runner/kernel_sdm845/AnyKernel3/*"

      - name: "Create GitHub Release"
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        if: ${{ env.useAnykernel == 'true'}}
        with:
          tag_name: "v${{ env.START_TIME }}.${{ github.run_number }}"
          body: "SukiSU Ultra Kernel for MIX 2S (polaris), SUSFS disabled for kernel 4.9"
          files: "/home/runner/kernel_sdm845/AnyKernel3.zip"
          generate_release_notes: true
